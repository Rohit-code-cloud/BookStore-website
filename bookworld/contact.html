<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | BookWorld</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="logo" href="index.html">Book<span>World</span></a>
      <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <button class="cart-btn" id="openCart" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
    </div>
  </header>

  <main>
    <section class="wrap section">
      <h1 class="page-title">Contact</h1>
      <div class="panel">
        <h2>Get in touch</h2>
        <p>Questions about an order or a title? Email us at <a href="mailto:support@bookworld.com">support@bookworld.com</a>.</p>
      </div>

      <h2 class="gap-top">Reader feedback</h2>
      <div class="two">
        <form id="feedbackForm" class="panel">
          <h3>Share your thoughts</h3>
          <label for="fbName">Your name</label>
          <input id="fbName" required autocomplete="name">
          <fieldset class="seg">
            <legend>Rating</legend>
            <input type="radio" name="rating" id="r5" value="5" checked><label for="r5">5</label>
            <input type="radio" name="rating" id="r4" value="4"><label for="r4">4</label>
            <input type="radio" name="rating" id="r3" value="3"><label for="r3">3</label>
            <input type="radio" name="rating" id="r2" value="2"><label for="r2">2</label>
            <input type="radio" name="rating" id="r1" value="1"><label for="r1">1</label>
          </fieldset>
          <label for="fbMessage">Message</label>
          <textarea id="fbMessage" required minlength="5" placeholder="What did you like, and what could we improve?"></textarea>
          <button class="btn" type="submit">Send feedback</button>
        </form>
        <div id="feedbackList" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <div><strong>BookWorld</strong><p class="muted">Email: <a href="mailto:support@bookworld.com">support@bookworld.com</a></p></div>
      <p class="muted">© 2026 BookWorld. All rights reserved.</p>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button class="icon" id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div id="cartItems" class="drawer-body"></div>
    <div class="drawer-foot">
      <div class="sum-row total"><span>Total</span><span id="cartTotal">₹0</span></div>
      <a class="btn full" id="checkoutLink" href="payment.html">Go to payment</a>
    </div>
  </aside>
  <div id="toast" class="toast" role="status"></div>

  <script src="common.js"></script>
  <script src="cart.js"></script>
  <script src="contact.js"></script>
</body>
</html>
