<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books | BookWorld</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="logo" href="index.html">Book<span>World</span></a>
      <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="books.html" aria-current="page">Books</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="cart-btn" id="openCart" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
    </div>
  </header>

  <main>
    <section class="wrap section">
      <h1 class="page-title">Our collection</h1>
      <div class="tools">
        <input type="search" id="searchInput" placeholder="Search by title, author or category" aria-label="Search books">
        <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      </div>
      <div class="grid" id="bookContainer"></div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <div><strong>BookWorld</strong><p class="muted">Email: <a href="mailto:support@bookworld.com">support@bookworld.com</a></p></div>
      <p class="muted">© 2026 BookWorld. All rights reserved.</p>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button class="icon" id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div id="cartItems" class="drawer-body"></div>
    <div class="drawer-foot">
      <div class="sum-row total"><span>Total</span><span id="cartTotal">₹0</span></div>
      <a class="btn full" id="checkoutLink" href="payment.html">Go to payment</a>
    </div>
  </aside>
  <div id="toast" class="toast" role="status"></div>

  <script src="common.js"></script>
  <script src="cart.js"></script>
  <script src="books.js"></script>
</body>
</html>
